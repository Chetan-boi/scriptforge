[project]
name = "scriptforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chetan-boi", email = "Chetan140209@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "reportlab>=5.1.0",
    "rich>=15.0.0",
]

[project.scripts]
scriptforge = "scriptforge.main:main"
scriptforge-gui = "scriptforge.main:gui_direct"
scriptforge-cli = "scriptforge.main:cli"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
